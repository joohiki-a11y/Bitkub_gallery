  /* ---- Single media lightbox ----------------------------------------------- */
  function LightboxBtn({ label, ariaLabel, style, onClick }) {
    const [hover, setHover] = useState(false);
    return html`<button onClick=${(e) => { e.stopPropagation(); onClick(); }} aria-label=${ariaLabel} onMouseEnter=${() => setHover(true)} onMouseLeave=${() => setHover(false)}
      style=${{ ...style, background: hover ? GREEN : "rgba(255,255,255,0.14)", border: `1px solid ${hover ? GREEN : "rgba(255,255,255,0.3)"}`, color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s" }}>${label}</button>`;
  }

  function LightboxPhoto({ item, alt }) {
    const src = item.full || item.src;
    const [loaded, setLoaded] = useState(false);
    const [failed, setFailed] = useState(false);
    useEffect(() => { setLoaded(false); setFailed(false); }, [src]);
    return html`
      <div style=${{ position: "relative", width: loaded ? "fit-content" : "100%", maxWidth: "100%", height: loaded ? "auto" : "min(74vh,780px)", minHeight: loaded ? 0 : "240px", borderRadius: "14px", overflow: "hidden", background: loaded || failed ? "#111" : "linear-gradient(100deg,#171717 30%,#242424 50%,#171717 70%)", backgroundSize: "200% 100%", animation: loaded || failed ? "none" : "merShimmer 1.4s ease-in-out infinite", boxShadow: "0 30px 80px rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center" }}>
        ${!failed && html`<img src=${src} alt=${alt} decoding="async" fetchpriority="high" draggable="false"
          onLoad=${() => setLoaded(true)} onError=${() => setFailed(true)}
          style=${{ width: "auto", height: "auto", maxWidth: "100%", maxHeight: "74vh", objectFit: "contain", display: loaded ? "block" : "none", userSelect: "none", WebkitUserDrag: "none", touchAction: "pan-y pinch-zoom" }} />`}
        ${failed && html`<div role="status" style=${{ color: "rgba(255,255,255,0.78)", fontSize: "14px", textAlign: "center", padding: "24px" }}>โหลดรูปนี้ไม่สำเร็จ กรุณาลองเปิดรูปต้นฉบับ</div>`}
        ${!loaded && !failed && html`<span role="status" style=${{ position: "absolute", color: "rgba(255,255,255,0.66)", fontSize: "13px" }}>กำลังโหลดรูปความละเอียดสูง…</span>`}
      </div>`;
  }

  function MediaLightbox({ album, index, single, onClose, onPrev, onNext, onSelect, onStop }) {
    const m = album.media[index];
    const isVideo = m.type === "video";
    const title = m.label || `${album.title} · ${index + 1}`;
    const isTikTok = m.platform === "tiktok"; // portrait player
    const embedSrc = videoEmbed(m);
    const watchUrl = m.vurl || "";
    const photoUrl = !isVideo ? (m.full || m.src) : "";
    const [showGestureHint, setShowGestureHint] = useState(false);
    const watchLabel = "เปิดใน " + (PLATFORM_NAME[m.platform] || "แหล่งที่มา");
    // TikTok is 9:16; YouTube/Facebook 16:9.
    const videoBox = isTikTok
      ? { height: "min(80vh, 760px)", aspectRatio: "9 / 16", maxWidth: "100%", borderRadius: "14px", overflow: "hidden", background: "#000", boxShadow: "0 30px 80px rgba(0,0,0,0.5)" }
      : { width: "100%", aspectRatio: "16 / 9", borderRadius: "14px", overflow: "hidden", background: "#000", boxShadow: "0 30px 80px rgba(0,0,0,0.5)" };
    const dlg = useDialog();
    const trackpad = useStepTrackpad(dlg, (direction) => direction > 0 ? onNext() : onPrev(), !single);
    useEffect(() => {
      if (single) return;
      try {
        if (window.localStorage.getItem("gallery-gesture-hint-v1")) return;
        window.localStorage.setItem("gallery-gesture-hint-v1", "seen");
      } catch (e) { /* storage can be blocked; the hint may appear again */ }
      setShowGestureHint(true);
      const timer = setTimeout(() => setShowGestureHint(false), 3800);
      return () => clearTimeout(timer);
    }, [single]);
    useEffect(() => {
      if (single || album.media.length < 2) return;
      const count = album.media.length;
      const neighbours = [album.media[(index - 1 + count) % count], album.media[(index + 1) % count]];
      neighbours.forEach((item) => {
        if (item && item.type === "photo") {
          const src = item.full || item.src;
          if (src) { const preload = new Image(); preload.src = src; }
        }
      });
    }, [album, index, single]);
    return html`
      <div ref=${dlg} data-testid="media-lightbox" role="dialog" aria-modal="true" aria-label=${`${title}${single ? "" : " ปัดนิ้วบนหน้าจอหรือปัดสองนิ้วบนทัชแพดเพื่อดูรายการอื่น"}`} tabindex="-1" onClick=${onClose} style=${{ position: "fixed", inset: 0, zIndex: 120, background: "rgba(15,15,15,0.86)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: "clamp(12px,4vw,64px)", animation: "merFade 0.25s ease", outline: "none", overflowY: "auto", overscrollBehaviorX: "contain", touchAction: "pan-y pinch-zoom" }}>

        <${LightboxBtn} label="✕" ariaLabel="ปิด" onClick=${onClose} style=${{ position: "absolute", top: "20px", right: "20px", zIndex: 5, width: "42px", height: "42px", borderRadius: "50%", fontSize: "18px", lineHeight: 1 }} />
        ${!single && html`<${LightboxBtn} label="←" ariaLabel="ก่อนหน้า" onClick=${onPrev} style=${{ position: "absolute", left: "clamp(8px,2vw,28px)", top: "50%", transform: "translateY(-50%)", zIndex: 5, width: "50px", height: "50px", borderRadius: "50%", fontSize: "20px" }} />`}
        ${!single && html`<${LightboxBtn} label="→" ariaLabel="ถัดไป" onClick=${onNext} style=${{ position: "absolute", right: "clamp(8px,2vw,28px)", top: "50%", transform: "translateY(-50%)", zIndex: 5, width: "50px", height: "50px", borderRadius: "50%", fontSize: "20px" }} />`}
        ${showGestureHint && html`<div role="status" style=${{ position: "absolute", top: "22px", left: "50%", transform: "translateX(-50%)", zIndex: 4, maxWidth: "calc(100% - 150px)", padding: "8px 14px", borderRadius: "999px", background: "rgba(15,15,15,0.7)", color: "rgba(255,255,255,0.88)", fontSize: "12px", textAlign: "center", pointerEvents: "none", animation: "merFade 0.25s ease" }}>ปัดซ้าย–ขวาด้วยนิ้วหรือทัชแพดเพื่อดูรายการถัดไป</div>`}

        <div key=${`${album.id}:${index}`} onClick=${onStop} style=${{ width: "100%", maxWidth: "1100px", display: "flex", flexDirection: "column", alignItems: "center", gap: "18px", animation: "merFade 0.16s ease both", transform: `translate3d(${trackpad.offset}px,0,0)`, opacity: Math.max(0.72, 1 - Math.abs(trackpad.offset) / (CONFIG.GESTURE.LIGHTBOX_PIXELS_PER_ITEM * 3)), transition: trackpad.active ? "none" : "transform 0.2s ease, opacity 0.2s ease", willChange: "transform, opacity" }}>
          ${isVideo
            ? (embedSrc
                ? html`<div style=${videoBox}>
                    <iframe src=${embedSrc} style=${{ width: "100%", height: "100%", border: 0, display: "block" }} referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen=${true}></iframe>
                  </div>`
                : html`<div style=${{ width: "100%", aspectRatio: "16 / 9", borderRadius: "14px", background: "#000", color: "rgba(255,255,255,0.85)", display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center", padding: "24px", boxShadow: "0 30px 80px rgba(0,0,0,0.5)" }}>ลิงก์นี้เล่นในหน้าเว็บไม่ได้ — กด "${watchLabel}" ด้านล่างเพื่อเปิดในแหล่งที่มา</div>`)
            : html`<${LightboxPhoto} item=${m} alt=${m.alt || title} />`}
          ${!single && html`
            <div data-testid="media-strip" class="mer-noscroll" aria-label="เลือกรูปหรือวิดีโอ" style=${{ width: "100%", display: "flex", justifyContent: "safe center", gap: "8px", overflowX: "auto", scrollbarWidth: "none", padding: "2px 4px" }}>
              ${album.media.map((item, itemIndex) => {
                const current = itemIndex === index;
                const thumb = item.type === "video" ? videoThumb(item, "hqdefault") : imageVariant(item.thumbnail || item.src, 180);
                return html`<button key=${itemIndex} onClick=${(e) => { e.stopPropagation(); onSelect(itemIndex); }} aria-label=${`ดูรายการ ${itemIndex + 1}`}
                  aria-current=${current ? "true" : undefined}
                  style=${{ position: "relative", flex: "0 0 auto", width: "58px", height: "40px", padding: 0, overflow: "hidden", borderRadius: "7px", border: current ? `2px solid ${GREEN}` : "1px solid rgba(255,255,255,0.25)", background: "#222", cursor: "pointer", opacity: current ? 1 : 0.64, transition: "opacity 0.2s,border-color 0.2s" }}>
                  ${thumb
                    ? html`<img src=${thumb} alt="" loading="lazy" decoding="async" style=${{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />`
                    : html`<span aria-hidden="true" style=${{ color: "#fff", fontSize: "14px" }}>▶</span>`}
                </button>`;
              })}
            </div>`}
          <div style=${{ display: "flex", alignItems: "center", gap: "16px", color: "#fff", flexWrap: "wrap", justifyContent: "center" }}>
            <span style=${{ fontWeight: 500, fontSize: "15px" }}>${title}</span>
            <span style=${{ width: "4px", height: "4px", borderRadius: "50%", background: "rgba(255,255,255,0.4)" }}></span>
            <span data-testid="media-count" style=${{ fontFamily: "'Quicksand',sans-serif", fontWeight: 600, fontSize: "13px", color: "rgba(255,255,255,0.7)", letterSpacing: "0.04em" }}>${index + 1} / ${album.media.length}</span>
            ${isVideo && watchUrl && html`<a href=${watchUrl} target="_blank" rel="noopener noreferrer" style=${{ fontFamily: "'Quicksand',sans-serif", fontWeight: 600, fontSize: "13px", color: "#02D767", textDecoration: "none", borderBottom: "1px solid rgba(2,215,103,0.5)", paddingBottom: "1px" }}>${watchLabel} ↗</a>`}
            ${!isVideo && photoUrl && html`<a href=${photoUrl} target="_blank" rel="noopener noreferrer" style=${{ fontFamily: "'Quicksand',sans-serif", fontWeight: 600, fontSize: "13px", color: "#02D767", textDecoration: "none", borderBottom: "1px solid rgba(2,215,103,0.5)", paddingBottom: "1px" }}>เปิดรูปต้นฉบับ ↗</a>`}
          </div>
        </div>
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
